name: Run MyPy

on:
  push:
    branches: [ main, 7.x]
  pull_request:
    branches: [ main, 7.x]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
    - name: Install dependencies
      shell: bash
      run: |
        uv pip install --system mypy pyflakes flake8 '.[all]'
    - name: Lint with mypy
      shell: bash
      run: |
        set -e
        mypy IPython
    - name: Lint with mypy (cross-platform typeshed checks)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -e
        mypy --platform linux IPython
        mypy --platform darwin IPython
        mypy --platform win32 IPython
    - name: Lint with mypy (win32 typeshed check)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        mypy --platform win32 IPython
    - name: Lint with pyflakes
      shell: bash
      run: |
        set -e
        flake8  IPython/core/magics/script.py
        flake8  IPython/core/magics/packaging.py
