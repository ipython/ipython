name: Run MyPy

on:
  push:
    branches: [ main, 7.x]
  pull_request:
    branches: [ main, 7.x]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
    - name: Install dependencies
      shell: bash
      run: |
        uv pip install --system mypy pyflakes flake8 '.[all]'
    - name: Lint with mypy
      shell: bash
      run: |
        set -e
        mypy IPython
    - name: Lint with mypy (cross-platform typeshed checks)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        set -e
        mypy --platform linux IPython
        mypy --platform darwin IPython
        mypy --platform win32 IPython
    - name: Lint with mypy (win32 typeshed check)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        set -e
        mypy --platform win32 IPython
    - name: Lint with pyflakes
      shell: bash
      run: |
        set -e
        flake8  IPython/core/magics/script.py
        flake8  IPython/core/magics/packaging.py
